# Only the AI relay lives on the Pi; the PWA is served by Cloudflare Pages.
services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8090:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [front, internal]
    depends_on: [relay]
    restart: unless-stopped

  relay:
    build: ./relay
    env_file: .env
    environment:
      ANTHROPIC_BASE_URL: http://egress:8080
      GRADIUM_BASE_URL: http://egress:8082
      HOME: /tmp
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - vaults:/data/vaults        # account vaults: ciphertext + scrypt hash only (relay/accounts.py)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    networks: [internal]
    restart: unless-stopped

  egress:
    build: ./egress
    command: mitmweb -s /redact.py --mode reverse:https://api.anthropic.com@8080 --mode reverse:https://us.api.gradium.ai@8082 --web-host 0.0.0.0 --web-port 8091 --no-web-open-browser
    ports: ["127.0.0.1:8091:8091"]
    mem_limit: 256m
    networks: [internal, outbound]
    restart: unless-stopped

volumes:
  vaults: {}

networks:
  front: {}
  outbound: {}
  internal:
    internal: true
