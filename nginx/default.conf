# The API gateway (only the relay lives on the Pi; the PWA is served by Cloudflare Pages).
# Defence in depth in front of the relay: method allowlist, per-client and global rate limits, connection limits,
# slow-client timeouts, size caps, security headers, JSON errors. Logs nothing; strips client addresses before
# the relay, so the relay never sees who you are.

map $http_origin $cors_origin {
    default "";
    "https://huskyhealth.vedsite.com" $http_origin;
    "https://huskyhealth.pages.dev" $http_origin;
    "~^https://[a-z0-9-]+\.huskyhealth\.pages\.dev$" $http_origin;
}

# Rate-limit key: the address the proxy in front (Tailscale Funnel) appended last, which a client cannot forge;
# without one, the connection address. Kept in nginx's shared memory only, never logged or passed on.
map $http_x_forwarded_for $client_key {
    ""                              $binary_remote_addr;
    "~(?<last_hop>[0-9A-Fa-f.:]+)\s*$" $last_hop;
    default                         $binary_remote_addr;
}
# Log in and account creation run scrypt: a much stricter limit, applied only to those two paths.
map $uri $auth_key {
    "~^/v1/account/(create|open)$" $client_key;
    default                        "";
}

limit_req_zone  $client_key  zone=perclient:10m rate=20r/s;
limit_req_zone  $auth_key    zone=auth:10m      rate=12r/m;
limit_req_zone  $server_name zone=everyone:1m   rate=200r/s;     # backstop if every client looked the same
limit_conn_zone $client_key  zone=conns:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    access_log off;
    server_tokens off;

    # size and slow-client limits (slowloris, oversized headers and bodies)
    client_max_body_size 256k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 200;
    limit_conn conns 20;

    error_page 413 = @too_large;
    error_page 429 = @slow_down;
    error_page 405 = @method;

    # method allowlist
    if ($request_method !~ ^(GET|HEAD|POST|DELETE|OPTIONS)$) { return 405; }

    location /v1/ {
        limit_req zone=auth      burst=6   nodelay;
        limit_req zone=perclient burst=40  nodelay;
        limit_req zone=everyone  burst=400 nodelay;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Retry-After, API-Version" always;
        add_header Access-Control-Max-Age "600" always;
        add_header Vary "Origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;      # Cache-Control: no-store comes from the relay
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://relay:8000;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / { return 404; }

    # the gateway's own errors use the relay's error shape, and browsers can read them
    location @slow_down {
        default_type application/json;
        add_header Retry-After "10" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Expose-Headers "Retry-After" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"error":"slow down","status":429}';
    }
    location @too_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 413 '{"error":"too large","status":413}';
    }
    location @method {
        default_type application/json;
        add_header Allow "GET, HEAD, POST, DELETE, OPTIONS" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 405 '{"error":"method not allowed","status":405}';
    }
}
